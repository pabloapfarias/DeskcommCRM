# DeskcommCRM - modo de desenvolvimento no mesmo CT da instalação.
#
# Ativação inicial:
#   ./scripts/dev-stack.sh
#
# Depois da ativação, alterações em app/, lib/, components/ e demais arquivos
# do projeto são vistas diretamente pelo Next.js. Alterações no worker fazem o
# tsx reiniciar apenas o processo do worker. Waha, Supabase, Redis, Caddy e
# scheduler não são recriados por este override.
#
# O arquivo deve ser combinado com a stack principal:
#   docker compose -f docker-compose.prod.yml \
#     -f docker-compose.supabase-network.yml \
#     -f docker-compose.dev.yml ...

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: deskcomm-dev-app:local
    pull_policy: never
    working_dir: /app
    entrypoint: []
    command:
      - sh
      - -lc
      - |
        if [ ! -x /app/node_modules/.bin/next ]; then
          echo "node_modules ausente; execute pnpm install --frozen-lockfile no CT."
          exit 1
        fi
        exec /app/node_modules/.bin/next dev --hostname 0.0.0.0 --port 3000
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules:ro
      - deskcomm_next_dev:/app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    # O Next/Turbopack em modo desenvolvimento recompila rotas sob demanda e
    # pode ultrapassar 2 GiB durante uma sessão de trabalho. O CT tem memória
    # disponível; mantenha folga para evitar OOM e 502 no proxy.
    mem_limit: 8g

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: deskcomm-dev-worker:local
    pull_policy: never
    working_dir: /app
    entrypoint: []
    command:
      - sh
      - -lc
      - |
        if [ ! -x /app/node_modules/.bin/tsx ]; then
          echo "node_modules ausente; execute pnpm install --frozen-lockfile no CT."
          exit 1
        fi
        exec /app/node_modules/.bin/tsx watch --clear-screen=false workers/agent-worker/main.ts
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules:ro
    environment:
      NODE_ENV: development
    mem_limit: 1g

volumes:
  deskcomm_next_dev:
